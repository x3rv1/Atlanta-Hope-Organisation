services:
  - type: web
    name: atlanta-hope-backend
    env: python
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
